<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{robots}}
<link rel="canonical" href="{{canonical}}">
<link rel="alternate" hreflang="en" href="{{enUrl}}">
<link rel="alternate" hreflang="es" href="{{esUrl}}">
<link rel="alternate" hreflang="x-default" href="{{enUrl}}">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" data-theme="light">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" data-theme="dark">
<link rel="icon" href="{{root}}img/icons/favicon.ico" sizes="32x32">
<link rel="icon" href="{{root}}img/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{root}}img/icons/apple-touch-icon.png">
<link rel="manifest" href="{{root}}site.webmanifest">
<meta property="og:type" content="website">
<meta property="og:locale" content="{{ogLocale}}">
<meta property="og:site_name" content="{{siteName}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{baseUrl}}/img/brand/og-default.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- RELATIVE PATHS ON PURPOSE: the site lives under /iGen-Website/ on GitHub Pages and at
     the root of igencad.com later. The stamper prefixes "../" for pages one level down. -->
<link rel="stylesheet" href="{{root}}css/tokens.css">
<link rel="stylesheet" href="{{root}}css/base.css">
<link rel="stylesheet" href="{{root}}css/layout.css">
<link rel="stylesheet" href="{{root}}css/components.css">
<!-- The js class gates the mobile menu, the scroll reveal and the custom controls. It is set before
     first paint (no layout shift) but only when the browser can run the ES modules; the footer's
     module tag flips it back to no-js if main.js fails to load. -->
<script>if ('noModule' in HTMLScriptElement.prototype) document.documentElement.className = document.documentElement.className.replace('no-js', 'js');
/* Dark mode: a stored choice is applied before first paint; with no choice the CSS follows the device. */
try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
