<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="{{root}}" aria-label="iGen CAD CAM Designers — home">
      <!-- Full lockup at every size; the height per breakpoint lives in layout.css and compacts on
           scroll (nav.js). Assets are 2x. -->
      <picture>
        <!-- data-theme / data-media let theme.js rewrite the media queries when a visitor overrides
             the device setting; without JS the prefers-color-scheme sources still do the right thing. -->
        <source type="image/webp" media="(prefers-color-scheme: dark) and (min-width: 1200px)" data-theme="dark" data-media="(min-width: 1200px)" srcset="{{root}}img/brand/logo-all-gold-336.webp">
        <source type="image/webp" media="(prefers-color-scheme: dark)" data-theme="dark" data-media="" srcset="{{root}}img/brand/logo-all-gold-224.webp">
        <source media="(prefers-color-scheme: dark) and (min-width: 1200px)" data-theme="dark" data-media="(min-width: 1200px)" srcset="{{root}}img/brand/logo-all-gold-336.png">
        <source media="(prefers-color-scheme: dark)" data-theme="dark" data-media="" srcset="{{root}}img/brand/logo-all-gold-224.png">
        <source type="image/webp" media="(min-width: 1200px)" data-theme="light" data-media="(min-width: 1200px)" srcset="{{root}}img/brand/logo-full-color-336.webp">
        <source type="image/webp" data-theme="light" data-media="" srcset="{{root}}img/brand/logo-full-color-224.webp">
        <source media="(min-width: 1200px)" data-theme="light" data-media="(min-width: 1200px)" srcset="{{root}}img/brand/logo-full-color-336.png">
        <img src="{{root}}img/brand/logo-full-color-224.png" width="275" height="224" alt="iGen CAD CAM Designers" decoding="async" fetchpriority="high">
      </picture>
    </a>
    <nav class="site-nav" aria-label="Main">

        <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <ul class="site-nav__list" id="site-nav-list">
        <li><a href="{{root}}" data-nav="home">Home</a></li>
