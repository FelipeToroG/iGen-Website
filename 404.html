<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | iGen CAD CAM Designers</title>
<meta name="robots" content="noindex">
<!-- GitHub Pages serves this file for ANY missing path, at any depth, so relative
     paths here would break. The styles are inlined and the links are resolved at
     runtime from the first path segment (/iGen-Website/ on github.io, / on igencad.com). -->
<link rel="stylesheet" href="/css/tokens.css" data-site-path="css/tokens.css">
<link rel="stylesheet" href="/css/base.css" data-site-path="css/base.css">
<link rel="stylesheet" href="/css/layout.css" data-site-path="css/layout.css">
<link rel="stylesheet" href="/css/components.css" data-site-path="css/components.css">
<link rel="icon" href="/img/icons/favicon.ico" sizes="32x32" data-site-path="img/icons/favicon.ico">
<link rel="icon" href="/img/icons/favicon.svg" type="image/svg+xml" data-site-path="img/icons/favicon.svg">
<style>
  /* Minimal fallback so the page reads even if the stylesheet links above miss. Token fallbacks
     keep the dark theme working when they do load. */
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; color: var(--color-text, #2C2C2C); background: var(--color-bg, #FFFFFF); margin: 0; }
  .error-page { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: 4rem 1rem; }
  .error-page p { color: var(--color-text-muted, #5F5F63); max-width: 44ch; margin: 1rem auto 1.5rem; }
  a { color: var(--color-link, #9A4A00); }
  .btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 1.5rem; border-radius: 999px; background: var(--color-btn-bg, #FCA42C); color: var(--color-btn-text, #2C2C2C); font-weight: 600; text-decoration: none; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body { color: #F5F5F7; background: #141414; } }
  :root[data-theme="dark"] body { color: #F5F5F7; background: #141414; }
</style>
<script>
  try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}
  // Resolve the site root once. On github.io the site lives under /<repo>/; on a custom
  // domain it lives at /. Everything on this page is rewritten against that root.
  (function () {
    var seg = location.pathname.split('/')[1];
    var root = (location.hostname.endsWith('github.io') && seg) ? '/' + seg + '/' : '/';
    document.documentElement.setAttribute('data-root', root);
    document.querySelectorAll('link[data-site-path]').forEach(function (l) { l.href = root + l.getAttribute('data-site-path'); });
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('a[data-rel]').forEach(function (a) { a.href = root + a.getAttribute('data-rel'); });
    });
  })();
</script>
</head>
<body data-page="404" data-noindex>
<main id="main">
  <section class="error-page">
    <div>
      <span class="eyebrow">404</span>
      <h1>That page isn't here.</h1>
      <p>The address may be out of date. The site was rebuilt in 2026 and old WordPress links no longer apply.</p>
      <p><a class="btn btn--primary" href="/" data-rel="">Go to the home page</a></p>
      <p><a href="/contact/" data-rel="contact/">Contact</a> · <a href="tel:+18137816255">(813) 781-6255</a></p>
    </div>
  </section>
</main>
</body>
</html>
